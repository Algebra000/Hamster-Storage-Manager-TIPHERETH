    <script>//方法、工具类

        const statusElement = document.getElementById('connectstateTXT');
        //const messagesElement = document.getElementById('messages');
        const nowpath = document.getElementById('pathframe');
        const mainUI = document.getElementById('main');

        //基础事件处理
        function BasicEvent()
        {
            /**
             * 创建图标的底块元素(鼠标移到上面会变色)
             * @param {number} x - 可见x
             */
            this.create_choose_div = function create_choose_div(x)
            {
                return;
            }

            /**
             * 连接到后端瞬间要执行的任务
             */
            this.when_connect = function when_connect()
            {
                nowpath.disabled = false;
                statusElement.textContent = '🟩 连接成功';
                statusElement.style.color = 'green';
                
                // 遍历执行 when_connect 函数列表
                for (const func of when_connect_func_list) {
                    try {
                        func();
                    } catch (e) {
                        console.error('执行 when_connect 函数出错:', e);
                    }
                }
                
                return;
            }

            /**
             * 断开瞬间要执行的任务
             */
            this.when_disconnect = function when_disconnect()
            {
                nowpath.disabled = true;
                statusElement.textContent = '🟥 未连接后端';
                statusElement.style.color = 'red';
                nowpath.value = '';
                
                // 遍历执行 when_disconnect 函数列表
                for (const func of when_disconnect_func_list) {
                    try {
                        func();
                    } catch (e) {
                        console.error('执行 when_disconnect 函数出错:', e);
                    }
                }
                
                return;
            }

        }

        let basicEvent = new BasicEvent()
    </script>
    <script>
        let socket = null;

        //为Websocket添加自动重连逻辑
        function createAutoReconnectWebSocket(url, onMessage) {
            let ws = null;
            let reconnectAttempts = 0;
            const maxReconnectDelay = 30000;
            let isConnected = false;//连接状态
            
            function connect() {
                console.log(`连接 ${url}...`);
                ws = new WebSocket(url);
                ws.binaryType = 'arraybuffer';
                
                ws.onopen = () => {
                    isConnected = true;
                    console.log('连接成功');
                    basicEvent.when_connect();
                    reconnectAttempts = 0;
                };
                
                ws.onmessage = onMessage;
                
                ws.onerror = (error) => {
                    console.error('连接错误:', error);
                    isConnected = false;
                };
                
                ws.onclose = () => {
                    console.log('连接断开');
                    basicEvent.when_disconnect();
                    isConnected = false;
                    
                    // 自动重连
                    reconnect();
                };
            }
            
            function reconnect() {
                reconnectAttempts++;
                
                // 指数退避
                const delay = 1000;//Math.min(1000 * Math.pow(2, reconnectAttempts), maxReconnectDelay);
                
                console.log(`${delay/1000}秒后尝试重连 (第${reconnectAttempts}次)`);
                
                setTimeout(connect, delay);
            }
            
            function send(data) {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(data);
                    return true;
                }
                return false;
            }
            
            connect();
            
            return {
                send,
                close: () => ws && ws.close(),
                reconnect: connect,
                isConnected: () => isConnected
            };
        }


        async function messageProc(event)
        {
            try {
                if (event.data instanceof ArrayBuffer || event.data instanceof Blob) {
                    const buffer = event.data instanceof Blob
                        ? await event.data.arrayBuffer()
                        : event.data;
                    const view = new DataView(buffer);
                    if (view.byteLength < 8 || view.getUint32(0, false) !== 0x48535631) {
                        console.error('收到无法识别的二进制消息');
                        return;
                    }
                    const headerLength = view.getUint32(4, false);
                    if (headerLength < 2 || 8 + headerLength > view.byteLength) {
                        console.error('比特流二进制消息头损坏');
                        return;
                    }
                    const headerBytes = new Uint8Array(buffer, 8, headerLength);
                    const header = JSON.parse(new TextDecoder('utf-8').decode(headerBytes));
                    const payload = buffer.slice(8 + headerLength);
                    for (const func of binary_message_proc_func_list) {
                        try {
                            func(header, payload);
                        } catch (e) {
                            console.error('处理二进制消息出错:', e);
                        }
                    }
                    return;
                }

                const data = JSON.parse(event.data);
                if (String(data.command) == 'SET_NOWPATH')
                {
                    nowpath.value = data.path;
                }
                
                // 遍历执行 message_proc 函数列表
                for (const func of message_proc_func_list) {
                    try {
                        func(data);
                    } catch (e) {
                        console.error('执行 message_proc 函数出错:', e);
                    }
                }

            } catch (e) {
                console.error('解析消息出错:', e);
            }
        }



        function connect() {
            // WebSocket连接
            socket = createAutoReconnectWebSocket('ws://localhost:8768', messageProc);
        }
        
        function disconnect() {
            if (socket) {
                socket.close();
                socket = null;
            }
        }
        
        // 页面加载时自动连接
        window.onload = function() {
            // 遍历执行 onload 函数列表
            for (const func of onload_func_list) {
                try {
                    func();
                } catch (e) {
                    console.error('执行 onload 函数出错:', e);
                }
            }
            connect();//待所有 onload 函数(多数为初始化任务)执行完成后连接
        };

        
    </script>
