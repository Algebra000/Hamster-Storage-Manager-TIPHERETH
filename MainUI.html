    <script>
        // In the APK, use a fixed CSS layout width and fit it to the window.
        // Leave ordinary browser rendering unchanged.
        if (location.hostname === 'appassets.androidplatform.net') {
            const viewport = document.querySelector('meta[name="viewport"]');
            const APP_LAYOUT_WIDTH = 960;
            // Java supplies the actual WebView width in density-independent pixels.
            // Do not derive scale from visualViewport.width: keyboard/focus zoom changes it.
            window.setAppViewportWidth = function (width) {
                if (!Number.isFinite(width) || width <= 0) return;
                const scale = width / APP_LAYOUT_WIDTH;
                const value = 'width=' + APP_LAYOUT_WIDTH + ', initial-scale=' + scale
                    + ', minimum-scale=' + scale + ', maximum-scale=' + scale
                    + ', user-scalable=no';
                if (viewport.content !== value) viewport.content = value;
            };
            window.setAppViewportWidth(window.screen.width);
        }

        // 函数列表
        const when_connect_func_list = [];
        const when_disconnect_func_list = [];
        const message_proc_func_list = [];
        const binary_message_proc_func_list = [];
        const onload_func_list = [];
        const event_handler_list = [];
        /** 按快照同步广播；参数由事件定义，返回值不截断广播。 */
        function frame_dispatch_event(event, wParam = null, lParam = null) {
            if (typeof event !== 'string') throw new TypeError('event 必须是字符串');
            for (const handler of [...event_handler_list]) {
                try {
                    const result = handler(event, wParam, lParam);
                    if (result && typeof result.then === 'function') {
                        Promise.resolve(result).catch(error => console.error('异步事件处理失败:', event, error));
                    }
                } catch (error) { console.error('事件处理失败:', event, error); }
            }
        }
        const VERSION_NAME = "TIPHERETH";
        const VERSION = "1.0.0";
        function get_version()
        {
            return {
                version_name: VERSION_NAME,
                version: VERSION
            };
        }

    <script>
        let socket = null;
        const addressInput = document.getElementById('serverAddress');
        const historyList = document.getElementById('serverHistory');
        const connectButton = document.getElementById('serverConnect');
        const SERVER_STORAGE_KEY = 'tiphereth.server-addresses.v1';
        let serverHistory = [], lastServerAddress = '', historyIndex = -1;
        const serverSignals = new Map();
        const probeControllers = new Set();
        let probeGeneration = 0, probeTimer = null;

        /**
         * 校验并规范化服务器地址，统一生成同端口的 HTTP 与 WebSocket 地址。
         * 支持主机名、IPv4、带方括号的 IPv6，以及 HTTP(S)/WS(S) 地址；省略端口时使用 8768。
         * @param {string} value 用户输入的服务器地址，允许路径为空、/ 或 /ws。
         * @returns {{address: string, httpUrl: string, wsUrl: string}} 历史记录地址、HTTP 基地址和以 /ws 结尾的 WebSocket 地址。
         * @throws {Error} 地址、协议或端口无效，包含账号或查询参数，或 HTTPS 页面尝试使用非加密连接。
         */
        function normalizeServerAddress(value) {
            const text = String(value).trim();
            if (!text || /\s/.test(text)) throw new Error('请输入有效的服务器 IP 或主机名，可附带端口');
            const explicitScheme = /^[a-z][a-z0-9+.-]*:\/\//i.test(text);
            let url;
            try { url = new URL(explicitScheme ? text : 'http://' + text); }
            catch { throw new Error('地址格式无效，例如 192.168.1.20:8768'); }
            if (!['http:', 'https:', 'ws:', 'wss:'].includes(url.protocol)
                || url.username || url.password || url.search || url.hash
                || !['/', '/ws', ''].includes(url.pathname)) {
                throw new Error('请输入服务器地址，不要包含账号、查询参数或资源路径');
            }
            const secure = ['https:', 'wss:'].includes(url.protocol);
            if (location.protocol === 'https:' && !secure) throw new Error('HTTPS 页面需要连接 HTTPS/WSS 服务');
            const authority = (explicitScheme ? text.split('://')[1] : text).split('/')[0];
            const explicitPort = authority.match(/:(\d+)$/);
            const port = explicitPort ? Number(explicitPort[1]) : Number(url.port || 8768);
            if (port < 1 || port > 65535) throw new Error('端口必须在 1～65535 之间');
            const host = url.hostname + ':' + port;
            return {address: (secure ? 'https://' : '') + host,
                httpUrl: (secure ? 'https://' : 'http://') + host,
                wsUrl: (secure ? 'wss://' : 'ws://') + host + '/ws'};
        }

        /**
         * 将最近地址和历史列表保存到浏览器 localStorage；保存失败时显示提示并保留内存记录。
         * @returns {void}
         */
        function saveServerHistory() {
            try {
                localStorage.setItem(SERVER_STORAGE_KEY, JSON.stringify({last: lastServerAddress, history: serverHistory}));
            } catch {
                document.getElementById('serverStorageNotice').hidden = false;
            }
        }

        /**
         * 将地址移到历史列表首位，去重后保留最近 20 项，并更新持久化记录。
         * @param {string} address 已由 normalizeServerAddress 规范化的历史记录地址。
         * @returns {void}
         */
        function rememberAddress(address) {
            lastServerAddress = address;
            serverHistory = [address, ...serverHistory.filter(item => item !== address)].slice(0, 20);
            saveServerHistory();
        }
        /**
         * 从 localStorage 恢复历史和最近地址，忽略无效条目；存储不可用时允许继续手动连接。
         * @returns {void}
         */
        function loadServerHistory() {
            try {
                const saved = JSON.parse(localStorage.getItem(SERVER_STORAGE_KEY) || '{}');
                for (const value of (Array.isArray(saved.history) ? saved.history : []).slice(0, 20)) {
                    try {
                        const address = normalizeServerAddress(value).address;
                        if (!serverHistory.includes(address)) serverHistory.push(address);
                    } catch { /* 忽略已损坏的历史条目。 */ }
                }
                if (saved.last) lastServerAddress = normalizeServerAddress(saved.last).address;
            } catch { /* 存储损坏或被禁用时仍可手动连接。 */ }
        }

        /**
         * 根据历史地址、探测结果和键盘选择位置重建下拉列表，同时更新辅助访问属性。
         * @returns {void}
         */
        function renderServerHistory() {
            historyList.replaceChildren();
            addressInput.removeAttribute('aria-activedescendant');
            if (!serverHistory.length) {
                const item = document.createElement('li');
                item.className = 'server-history-empty'; item.textContent = '暂无地址历史';
                historyList.append(item); return;
            }
            serverHistory.forEach((address, index) => {
                const item = document.createElement('li');
                item.id = 'server-history-' + index; item.setAttribute('role', 'option');
                item.setAttribute('aria-selected', String(index === historyIndex));
                const online = serverSignals.get(address) === true;
                const dot = document.createElement('span');
                dot.className = 'server-signal' + (online ? ' online' : '');
                dot.setAttribute('aria-hidden', 'true');
                const label = document.createElement('span'); label.textContent = address;
                item.append(dot, label);
                item.title = online ? '服务可达' : '未检测到服务（可能离线或被浏览器阻止）';
                item.setAttribute('aria-label', address + '，' + item.title);
                item.addEventListener('mousedown', event => event.preventDefault());
                item.addEventListener('click', () => selectServerHistory(index));
                historyList.append(item);
                if (index === historyIndex) addressInput.setAttribute('aria-activedescendant', item.id);
            });
        }
        /**
         * 将选中的历史地址填入输入框并保存，收起下拉列表；不自动切换连接。
         * @param {number} index serverHistory 中有效条目的下标，从 0 开始。
         * @returns {void}
         */
        function selectServerHistory(index) {
            addressInput.value = serverHistory[index];
            addressInput.setCustomValidity('');
            rememberAddress(addressInput.value);
            closeServerHistory(); addressInput.focus(); closeServerHistory();
        }
        /**
         * 收起历史列表、清除选择状态，取消正在执行的探测和下次刷新，并使旧探测结果失效。
         * @returns {void}
         */
        function closeServerHistory() {
            historyList.hidden = true; historyIndex = -1;
            addressInput.setAttribute('aria-expanded', 'false');
            addressInput.removeAttribute('aria-activedescendant');
            ++probeGeneration; clearTimeout(probeTimer);
            for (const controller of probeControllers) controller.abort();
            probeControllers.clear();
        }

        /**
         * 探测历史地址的服务信息并更新红绿圆点；最多并发 4 个请求，每个请求超时 2.5 秒。
         * 列表仍打开且本轮未失效时，在本轮结束 15 秒后再次探测；此探测不代替连接版本校验。
         * @returns {Promise<void>} 本轮所有探测任务结束后完成，不等待下一轮刷新。
         */
        async function probeServerHistory() {
            const generation = ++probeGeneration;
            const addresses = [...serverHistory]; let next = 0;
            /**
             * 从本轮共享地址队列中逐个探测，忽略已取消或过期的结果；已验证的连接可证明服务可达。
             * @returns {Promise<void>} 队列耗尽、列表收起或探测轮次失效时完成。
             */
            async function worker() {
                while (!historyList.hidden && generation === probeGeneration && next < addresses.length) {
                    const address = addresses[next++];
                    const controller = new AbortController(); probeControllers.add(controller);
                    const timeout = setTimeout(() => controller.abort(), 2500);
                    let online = false;
                    try {
                        const target = normalizeServerAddress(address);
                        const response = await fetch(target.httpUrl + '/api/server-info', {
                            signal: controller.signal, credentials: 'omit', cache: 'no-store', redirect: 'error'
                        });
                        if (response.ok) {
                            const data = await response.json();
                            online = data.protocol_version === 1 && data.websocket_path === '/ws';
                        }
                    } catch { /* 超时或浏览器网络策略拒绝均显示未检测到服务。 */ }
                    finally { clearTimeout(timeout); probeControllers.delete(controller); }
                    if (generation !== probeGeneration || historyList.hidden) return;
                    if (socket && socket.isConnected() && normalizeServerAddress(socket.url).address === address) online = true;
                    serverSignals.set(address, online); renderServerHistory();
                }
            }
            await Promise.all(Array.from({length: Math.min(4, addresses.length)}, worker));
            if (generation === probeGeneration && !historyList.hidden) probeTimer = setTimeout(probeServerHistory, 15000);
        }

        /**
         * 取消上一轮探测，展开并绘制历史列表，立即启动新的可达性探测。
         * @returns {void}
         */
        function openServerHistory() {
            closeServerHistory(); historyList.hidden = false;
            addressInput.setAttribute('aria-expanded', 'true');
            renderServerHistory(); probeServerHistory();
        }

        /**
         * 更新连接按钮、状态文字和根目录输入框；连接成功可标记绿点，断开不直接标记红点。
         * @param {'connecting'|'retrying'|'connected'|'disconnected'} state 当前连接状态。
         * @returns {void}
         */
        function updateConnectionUI(state) {
            const active = state !== 'disconnected';
            connectButton.textContent = active ? '断开' : '连接';
            connectButton.dataset.active = String(active);
            const labels = {connecting:'🟨 正在连接', retrying:'🟨 等待重连', connected:'🟩 连接成功', disconnected:'🟥 未连接后端'};
            statusElement.textContent = labels[state];
            statusElement.style.color = state === 'connected' ? 'green' : 'red';
            if (state !== 'connected') { nowpath.value = ''; nowpath.disabled = true; }
            // 连接成功可以证明服务可达；主动断开或重连不能证明服务离线。
            // 红点仅由 HTTP 探测失败决定，展开历史列表时会重新探测。
            if (socket && state === 'connected') {
                serverSignals.set(normalizeServerAddress(socket.url).address, true);
                if (!historyList.hidden) renderServerHistory();
            }
        }

        /**
         * 恢复地址记录，绑定连接按钮、历史选择和键盘事件，设置页面退出清理与工具栏高度监听。
         * 模块初始化后调用一次，最后自动连接最近地址，无历史时使用 localhost:8768。
         * @returns {void}
         */
        function initializeServerControls() {
            loadServerHistory();
            addressInput.value = lastServerAddress || 'localhost:8768';
            connectButton.addEventListener('click', () => socket && socket.isActive() ? disconnect() : connect());
            addressInput.addEventListener('focus', openServerHistory);
            addressInput.addEventListener('input', () => { addressInput.setCustomValidity(''); historyIndex = -1; });
            addressInput.addEventListener('change', () => {
                try { rememberAddress(normalizeServerAddress(addressInput.value).address); } catch { /* 连接时提示错误。 */ }
            });
            document.getElementById('serverHistoryToggle').addEventListener('click', () => {
                if (historyList.hidden) openServerHistory(); else closeServerHistory();
            });
            document.addEventListener('pointerdown', event => {
                if (!document.getElementById('serverPicker').contains(event.target)) closeServerHistory();
            });
            addressInput.addEventListener('keydown', event => {
                if (event.key === 'Escape') { closeServerHistory(); return; }
                if (event.key === 'Tab') { closeServerHistory(); return; }
                if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
                    event.preventDefault();
                    if (historyList.hidden) openServerHistory();
                    if (serverHistory.length) {
                        historyIndex = historyIndex < 0
                            ? (event.key === 'ArrowDown' ? 0 : serverHistory.length - 1)
                            : (historyIndex + (event.key === 'ArrowDown' ? 1 : -1) + serverHistory.length) % serverHistory.length;
                        renderServerHistory();
                        document.getElementById('server-history-' + historyIndex).scrollIntoView({block:'nearest'});
                    }
                } else if (event.key === 'Enter') {
                    event.preventDefault();
                    if (!historyList.hidden && historyIndex >= 0) selectServerHistory(historyIndex);
                    else connect();
                }
            });
            window.addEventListener('pagehide', () => { closeServerHistory(); });
            // 布局模块的顶部预留空间随工具栏高度变化，不改动第三方布局代码。
            new ResizeObserver(() => {
                mainUI.style.paddingTop = document.getElementById('upbar').offsetHeight + 'px';
            }).observe(document.getElementById('upbar'));
            connect();
        }

        /**
         * 创建带版本握手和自动重连的连接管理器；每个管理器独立维护定时器和连接代号。
         * 首条 BACKEND_VERSION 验证通过后才允许业务收发，主动关闭后旧事件不再影响界面。
         * @param {string} url 规范化的 WebSocket 地址，以 /ws 结尾。
         * @param {function(MessageEvent, function(): boolean): (void|Promise<void>)} onMessage 业务消息处理函数，第二个参数用于检查消息所属连接是否仍有效。
         * @returns {{url: string, send: Function, close: Function, reconnect: Function, isConnected: Function, isActive: Function}} 连接管理器；调用方须将其赋给全局 socket，连接在微任务中启动。
         */
        function createAutoReconnectWebSocket(url, onMessage) {
            let ws = null, timer = null, openingTimer = null, heartbeatTimer = null;
            const retiredTransports = new Set();
            let reconnectReason = '连接中断';
            let stopped = false, connected = false, attempt = 0, generation = 0;
            let messages = Promise.resolve();
            const connectionBytes = crypto.getRandomValues(new Uint8Array(16));
            connectionBytes[6] = (connectionBytes[6] & 15) | 64;
            connectionBytes[8] = (connectionBytes[8] & 63) | 128;
            const connectionHex = Array.from(connectionBytes, b => b.toString(16).padStart(2, '0')).join('');
            const connectionId = `${connectionHex.slice(0,8)}-${connectionHex.slice(8,12)}-${connectionHex.slice(12,16)}-${connectionHex.slice(16,20)}-${connectionHex.slice(20)}`;
            let sessionStarted = false;
            let establishedTransportId = null;
            let everConnected = false;
            function emitDisconnected(reason, willReconnect, code = null, detail = '') {
                connected = false;
                if (establishedTransportId === null) return;
                const transportId = establishedTransportId;
                establishedTransportId = null;
                frame_dispatch_event('WS_DISCONNECTED', connectionId, Object.freeze({
                    transportId, url, reason, code, detail, willReconnect
                }));
            }
            const transportUrl = new URL(url);
            transportUrl.searchParams.set('connectionId', connectionId);
            /**
             * 检查管理器是否仍是当前连接管理器且未停止。
             * @returns {boolean}
             */
            const active = () => !stopped && socket === api;

            /**
             * 取消重连等待和连接/版本验证超时定时器，并清空定时器引用。
             * @returns {void}
             */
            function clearTimers() {
                clearTimeout(timer); clearTimeout(openingTimer); clearTimeout(heartbeatTimer);
                timer = openingTimer = heartbeatTimer = null;
            }
            /**
             * 仅对已通过版本验证的连接执行一次断线回调，先清除已连接标记以避免重复通知。
             * @returns {void}
             */
            function notifyDisconnect() {
                if (sessionStarted) {
                    sessionStarted = false;
                    connected = false;
                    basicEvent.when_disconnect();
                }
            }
            /**
             * 发起一次 WebSocket 连接并绑定本次连接的事件，建立连接最多等待 10 秒。
             * 建立后最多等待 5 秒验证首条版本消息；业务消息串行分发，普通断线交由 schedule 重试。
             * @returns {void}
             */
            function open() {
                if (!active()) return;
                clearTimers();
                const id = ++generation;
                const previous = ws;
                if (previous && previous.readyState === WebSocket.OPEN && retiredTransports.size === 0) retiredTransports.add(previous);
                else if (previous && !retiredTransports.has(previous)) previous.close();
                const isReconnect = sessionStarted || attempt > 0;
                if (isReconnect) {
                    try {
                        window.frame_show_notice?.(`${reconnectReason}，正在尝试重新连接。`, 15000, '#F8D7DA', true, '#842029');
                    } catch (error) { console.warn('显示重连通知失败:', error); }
                }
                connected = false;

                /**
                 * 检查本次连接代号是否仍有效，阻止旧连接的异步事件影响当前状态。
                 * @returns {boolean}
                 */
                const current = () => active() && id === generation;
                updateConnectionUI(attempt ? 'retrying' : 'connecting');
                try {
                    ws = new WebSocket(transportUrl.href);
                } catch (error) {
                    schedule();
                    return;
                }
                const transport = ws;
                let connectedAt = null;
                let lastPong = 0, sequence = 0;
                const pendingPings = new Set();
                function heartbeat() {
                    if (!current() || !connected) return;
                    if (performance.now() - lastPong >= 3000) {
                        reconnectReason = '心跳超过 3 秒未应答';
                        emitDisconnected('heartbeat-timeout', true, null, reconnectReason);
                        if (current()) open();
                        return;
                    }
                    pendingPings.add(++sequence);
                    try { transport.send(JSON.stringify({command:'HEARTBEAT_PING', sequence})); }
                    catch { reconnectReason = '心跳发送失败'; emitDisconnected('send-failure', true, null, reconnectReason); if (current()) open(); return; }
                    heartbeatTimer = setTimeout(heartbeat, 1000);
                }
                transport.binaryType = 'arraybuffer';
                openingTimer = setTimeout(() => {
                    if (current() && transport.readyState === WebSocket.CONNECTING) {
                        reconnectReason = '建立连接超时';
                        open();
                    }
                }, 10000);

                /**
                 * 终止当前连接及重连计划，在状态栏和地址输入框中提示版本验证失败。
                 * @param {string} reason 显示给用户的失败原因。
                 * @returns {void}
                 */
                function rejectVersion(reason) {
                    if (!current()) return;
                    api.close();
                    statusElement.textContent = '🟥 版本错误';
                    addressInput.setCustomValidity(reason);
                    addressInput.reportValidity();
                }
                transport.onopen = () => {
                    if (!current()) { transport.close(); return; }
                    clearTimeout(openingTimer);
                    statusElement.textContent = '🟨 正在验证';
                    openingTimer = setTimeout(() => {
                        if (!current()) return;
                        reconnectReason = '连接验证超时';
                        connected = false;
                        open();
                    }, 5000);
                };
                transport.onmessage = event => {
                    if (!current()) return;
                    if (!connected) {
                        // 与 ROLAND 一致：首条消息声明后端支持的前端版本列表。
                        // 验证前不分发业务消息，也不允许模块发送消息。
                        let data;
                        try {
                            if (typeof event.data !== 'string') throw new Error('Expected text');
                            data = JSON.parse(event.data);
                        } catch {
                            rejectVersion('后端版本信息无效');
                            return;
                        }
                        if (!data || data.command !== 'BACKEND_VERSION' || !Array.isArray(data.version)
                            || !data.version.some(version => typeof version === 'string'
                                && version.trim().split(/\s+/)[0] === VERSION_NAME)) {
                            rejectVersion('后端不支持当前前端，需要 ' + VERSION_NAME + ' 支持');
                            return;
                        }
                        clearTimeout(openingTimer);
                        const reconnected = everConnected;
                        everConnected = true;
                        establishedTransportId = id;
                        connected = true; attempt = 0;
                        connectedAt = Date.now();
                        lastPong = performance.now();
                        for (const retired of retiredTransports) retired.close();
                        retiredTransports.clear();
                        heartbeatTimer = setTimeout(heartbeat, 1000);
                        if (!sessionStarted) {
                            sessionStarted = true;
                            basicEvent.when_connect();
                        }
                        if (!current() || !connected) return;
                        updateConnectionUI('connected');
                        frame_dispatch_event('WS_CONNECTED', connectionId, Object.freeze({
                            transportId: id, url, reconnected, resumed: data.resumed === true
                        }));
                        if (!current() || !connected) return;
                        if (isReconnect) {
                            try {
                                window.frame_show_notice?.('重新连接成功。', 15000, '#D1E7DD', true, '#0F5132');
                            } catch (error) { console.warn('显示重连成功通知失败:', error); }
                        }
                        return;
                    }
                    if (typeof event.data === 'string') {
                        try {
                            const reply = JSON.parse(event.data);
                            if (reply.command === 'HEARTBEAT_PONG') {
                                if (pendingPings.has(reply.sequence)) {
                                    lastPong = performance.now();
                                    for (const n of pendingPings) if (n <= reply.sequence) pendingPings.delete(n);
                                }
                                return;
                            }
                        } catch { /* 普通消息交由原处理逻辑解析。 */ }
                    }
                    // 串行处理 Blob 等异步消息，切换连接后丢弃旧消息。
                    messages = messages.then(() => current() && onMessage(event, current))
                        .catch(error => console.error('消息处理失败:', error));
                };
                transport.onerror = () => {
                    // 由 onclose 统一通知断线并安排重连，避免重复回调。
                    if (current()) console.warn('后端连接失败:', url);
                };
                transport.onclose = (event = {}) => {
                    if (!current()) return;
                    const diagnostic = {
                        time: new Date().toISOString(),
                        url,
                        code: event.code ?? null,
                        reason: event.reason || '',
                        wasClean: event.wasClean ?? null,
                        connectedForMs: connectedAt === null ? null : Date.now() - connectedAt
                    };
                    console.warn('[WebSocket 断线]', diagnostic);
                    clearTimeout(openingTimer); clearTimeout(heartbeatTimer);
                    reconnectReason = `连接关闭（${diagnostic.code ?? '未知'}）：${diagnostic.reason || '未提供原因'}`;
                    emitDisconnected('transport-close', true, diagnostic.code, diagnostic.reason);
                    if (current()) schedule();

                };
            }
            /**
             * 为仍有效的管理器安排重连，每次固定等待 1 秒；清除先前的重连定时器以避免重复尝试。
             * @returns {void}
             */
            function schedule() {
                if (!active()) return;
                ++attempt;
                const delay = 1000;
                updateConnectionUI('retrying');
                clearTimeout(timer);
                timer = setTimeout(open, delay);
            }
            const api = {
                url, connectionId,
                /**
                 * 在当前连接通过版本验证且 WebSocket 已打开时发送数据，不缓存或自动序列化。
                 * @param {string|ArrayBuffer|ArrayBufferView|Blob} data 原生 WebSocket 支持的消息载荷。
                 * @returns {boolean} 是否成功交给 WebSocket 发送，不代表后端业务处理成功。
                 */
                send(data) {
                    if (!active() || !connected || !ws || ws.readyState !== WebSocket.OPEN) return false;
                    try { ws.send(data); return true; } catch { return false; }
                },
                /**
                 * 停止本管理器，取消定时器并使旧连接事件失效，必要时通知模块断线并关闭 WebSocket。
                 * @returns {void}
                 */
                close(reason = 'manual-disconnect') {
                    if (stopped) return;
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({command: 'SESSION_DISCONNECT'}));
                    } else if (sessionStarted) {
                        // 传输已断时尽力建立一次连接发送结束消息；网络不可达由服务端超时回收。
                        try {
                            const ending = new WebSocket(transportUrl.href);
                            const deadline = setTimeout(() => ending.close(), 5000);
                            ending.onopen = () => {
                                ending.send(JSON.stringify({command: 'SESSION_DISCONNECT'}));
                                ending.close();
                            };
                            ending.onclose = () => clearTimeout(deadline);
                        } catch (error) { console.warn('无法发送主动中断消息:', error); }
                    }
                    stopped = true; ++generation;
                    clearTimers();
                    emitDisconnected(reason, false);
                    notifyDisconnect();
                    if (ws) ws.close();
                    for (const retired of retiredTransports) retired.close();
                    retiredTransports.clear();
                    if (socket === api) updateConnectionUI('disconnected');
                },
                /**
                 * 仅在本管理器仍是全局 socket 时，清理旧连接并立即发起一次新的连接尝试。
                 * @returns {void}
                 */
                reconnect() {
                    if (socket !== api) return;
                    stopped = false; ++generation;
                    clearTimers();
                    emitDisconnected('manual-reconnect', true);
                    if (!active()) return;
                    if (ws) ws.close();
                    attempt = 0; open();
                },
                /**

                }
            }

        };

        v.console.setPrompt(!connected?'后端连接已断开':input ? `${input.task_name}：${input.prompt}${task?.state!=='running'?'（恢复后可回答）':''}`:'当前没有任务等待输入');

        v.status.textContent=connected?'':'后端连接已断开，任务仍由服务器管理。';
    }
    function card(task,controls=false,plan=false){
        const c=el('div','task-card');const badge=el('span','task-badge '+task.state,names[task.state]||task.state);c.appendChild(badge);
        c.appendChild(el('strong','',task.name));
        if(plan){c.appendChild(el('small','',task.next_run_at?new Date(task.next_run_at).toLocaleString():'无法触发'));c.appendChild(el('small','',task.entries.map(e=>e.name).join(' → ')));}
        if(controls){if(!plan)c.appendChild(el('small','',new Date(task.created_at).toLocaleString()));
            if(task.waiting_for_input)c.appendChild(el('small','','等待控制台输入'));
            if(task.error)c.appendChild(el('small','task-danger',task.error));
            const row=el('div','task-actions');
            if(plan){row.append(btn('更改',()=>editSchedule(task)),btn('删除',()=>{if(window.confirm('删除此定时计划及尚未触发的任务？'))safeAction('TASK_SCHEDULE_DELETE',{schedule_id:task.schedule_id,expected_revision:task.revision});},'task-danger'));}
            else{const resume=task.state==='paused'||task.pause_requested;
                const pause=btn(task.cancel_requested?'正在终止':task.pause_requested?'正在暂停':resume?'恢复':'暂停',()=>safeAction(resume?'TASK_RESUME':'TASK_PAUSE',{task_id:task.task_id}));
                pause.disabled=!connected||task.cancel_requested||task.state==='failed'||(!resume&&!task.can_pause);
                const cancel=btn('终止',()=>{if(window.confirm('确认终止任务“'+task.name+'”？'))safeAction('TASK_CANCEL',{task_id:task.task_id});},'task-danger');cancel.disabled=!connected||task.cancel_requested;row.append(pause,cancel);}
            for(const b of row.children)if(!connected)b.disabled=true;
            c.appendChild(row);
        }
        return c;
    }
    function fillCards(host,items,controls,plan){host.replaceChildren();if(!items.length)host.appendChild(el('div','task-empty',connected?'暂无任务':'等待连接后端'));else for(const t of items)host.appendChild(card(t,controls,plan));}
    function render(){
        if(!button)return;
        const n=snapshot.inputs.length,badge=document.getElementById('taskInputCount');badge.textContent=String(n);badge.hidden=!n;
        stats.textContent=`主队列有 ${snapshot.stats.main_tasks} 个任务\n当前有 ${snapshot.stats.queues} 个队列\n正执行 ${snapshot.stats.running} 个任务`;
        fillCards(cards,snapshot.tasks.filter(t=>t.queue_id==='main'),false,false);
        for(const v of views){updateInput(v);v.render?.();}
    }
    function editSchedule(plan){
        const d=el('dialog','task-dialog'),form=el('form'),title=el('h3','','更改定时设置');
        const type=el('select');for(const [value,label]of [['once','单次'],['interval','固定间隔']]){const o=el('option','',label);o.value=value;type.appendChild(o);}type.value=plan.timing.type;
        const date=el('input');date.type='datetime-local';date.step='1';
        const current=new Date(plan.next_run_at || Date.now()+3600000);date.value=new Date(current.getTime()-current.getTimezoneOffset()*60000).toISOString().slice(0,19);
        const seconds=el('input');seconds.type='number';seconds.min='1';seconds.value=String(plan.timing.seconds||3600);
        for(const [label,control]of [['触发类型',type],['首次/单次触发时间',date],['间隔秒数',seconds]]){const l=el('label','',label);l.appendChild(control);form.appendChild(l);}
        const error=el('div','task-dialog-error');const row=el('div','task-actions'),save=btn('保存',()=>{}),cancel=btn('取消',()=>d.close());save.type='submit';row.append(cancel,save);form.prepend(title);form.append(error,row);d.appendChild(form);document.body.appendChild(d);
        type.addEventListener('change',()=>seconds.disabled=type.value==='once');seconds.disabled=type.value==='once';
        form.addEventListener('submit',async e=>{e.preventDefault();const stamp=new Date(date.value);if(!Number.isFinite(stamp.getTime())||stamp<=new Date()){error.textContent='请选择未来的时间';return;}
            const timing=type.value==='once'?{type:'once',run_at:stamp.toISOString()}:{type:'interval',start_at:stamp.toISOString(),seconds:Number(seconds.value)};
            save.disabled=true;try{await request('TASK_SCHEDULE_UPDATE',{schedule_id:plan.schedule_id,expected_revision:plan.revision,timing});d.close();refresh();}catch(e){error.textContent=e.message;}finally{save.disabled=false;}});
        d.addEventListener('close',()=>d.remove(),{once:true});d.showModal();
    }
    function taskIcon(pathData){
        const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 48 48');svg.setAttribute('aria-hidden','true');
        const path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('d',pathData);path.setAttribute('fill','none');path.setAttribute('stroke','currentColor');path.setAttribute('stroke-width','3.5');path.setAttribute('stroke-linecap','round');path.setAttribute('stroke-linejoin','round');svg.appendChild(path);return svg;
    }
    function openPage(){
        popover.hidden=true;button.setAttribute('aria-expanded','false');
        const page=new_page();page.classList.add('task-page');createBackButtons(page);page.appendChild(el('h2','','计划任务管理'));
        const deck=el('div','task-deck'),left=btn('',()=>flip(0),'task-arrow'),right=btn('',()=>flip(1),'task-arrow'),viewport=el('div','task-viewport'),slides=el('div','task-slides'),current=el('div','task-slide'),scheduled=el('div','task-slide');
        left.setAttribute('aria-label','上一页');right.setAttribute('aria-label','下一页');left.appendChild(taskIcon('M30 10L16 24l14 14'));right.appendChild(taskIcon('M18 10l14 14-14 14'));
        const header=el('div','task-row'),select=el('select');select.setAttribute('aria-label','查看队列');header.append(el('strong','task-slot-title','当前状态槽'),el('span','','队列'),select);const list=el('div','task-cards'),plans=el('div','task-cards');current.append(header,list);scheduled.append(el('strong','task-slot-title','定时任务槽'),plans);slides.append(current,scheduled);viewport.appendChild(slides);deck.append(left,viewport,right);page.appendChild(deck);
        const bottom=el('div','task-bottom'),side=el('div','task-sidebar'),host=el('div','task-log-panel'),toolbar=el('div','task-log-toolbar');
        const add=btn('',()=>{const blank=new_page();createBackButtons(blank);},'task-add');
        add.append(taskIcon('M24 7v34M7 24h34'),el('span','','新建任务'));
        side.append(add);toolbar.append(btn('清空日志',()=>safeAction('TASK_CLEAR_LOGS',{queue_id:view.queue})),el('span','','运行日志'));host.appendChild(toolbar);
        bottom.append(side,host);page.appendChild(bottom);const view=attachConsole(host,'main');
        select.addEventListener('change',()=>{view.switchQueue(select.value);view.render();});
        view.render=()=>{if(!snapshot.queues.some(q=>q.queue_id===view.queue))view.switchQueue('main');select.replaceChildren();for(const q of snapshot.queues){const count=snapshot.inputs.filter(r=>r.queue_id===q.queue_id).length;const o=el('option','',q.name+(count?` · ${count} 项等待输入`:''));o.value=q.queue_id;select.appendChild(o);}select.value=view.queue;select.disabled=!connected;fillCards(list,snapshot.tasks.filter(t=>t.queue_id===view.queue),true,false);fillCards(plans,snapshot.schedules,true,true);};
        let slide=0,startX=0,startY=0;function flip(index){slide=index;slides.style.transform=`translateX(-${slide*100}%)`;left.disabled=slide===0;right.disabled=slide===1;}flip(0);
        viewport.addEventListener('touchstart',e=>{startX=e.changedTouches[0].clientX;startY=e.changedTouches[0].clientY;},{passive:true});viewport.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-startX,dy=e.changedTouches[0].clientY-startY;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)&&!e.target.closest('.task-cards'))flip(dx<0?1:0);},{passive:true});
        page.cleanFuncList.push(()=>view.destroy());view.render();
    }
    function positionPopover(){if(!popover || popover.hidden)return;const rect=button.getBoundingClientRect();const width=Math.min(400,window.innerWidth*.4),top=Math.min(rect.bottom+8,Math.max(8,window.innerHeight-120));Object.assign(popover.style,{width:width+'px',height:Math.min(600,window.innerHeight-top-8)+'px',top:top+'px',left:Math.max(0,Math.min(rect.right-width,window.innerWidth-width))+'px'});}
    function init(){
        button=el('button');button.id='taskSlotButton';button.type='button';button.setAttribute('aria-label','计划任务');button.setAttribute('aria-expanded','false');
        const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 24 24');svg.setAttribute('aria-hidden','true');const path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('d','M4 4h16v16H4z M8 2v4 M16 2v4 M4 9h16 M8 13h3 M8 16h7');path.setAttribute('fill','none');path.setAttribute('stroke','currentColor');path.setAttribute('stroke-width','1.6');svg.appendChild(path);button.appendChild(svg);
        const count=el('span');count.id='taskInputCount';count.hidden=true;button.appendChild(count);document.getElementById('upbar').appendChild(button);
        popover=el('section','task-popover');popover.hidden=true;popover.setAttribute('aria-label','计划任务简报');stats=el('div','task-stat');stats.style.whiteSpace='pre-line';cards=el('div','task-cards');popover.append(el('h3','task-brief-title','任务情况简报'),stats,cards);document.body.appendChild(popover);attachConsole(popover,'main');const footer=el('div','task-actions');footer.append(btn('清空日志',()=>safeAction('TASK_CLEAR_LOGS',{queue_id:'main'})),btn('详细信息',openPage));popover.appendChild(footer);
        button.addEventListener('click',()=>{popover.hidden=!popover.hidden;button.setAttribute('aria-expanded',String(!popover.hidden));positionPopover();});
        document.addEventListener('click',e=>{if(!popover.hidden && !popover.contains(e.target)&&!button.contains(e.target)){popover.hidden=true;button.setAttribute('aria-expanded','false');}});
        document.addEventListener('keydown',e=>{if(e.key==='Escape'){popover.hidden=true;button.setAttribute('aria-expanded','false');}});window.addEventListener('resize',positionPopover);
        render();
    }
    onload_func_list.push(init);when_connect_func_list.push(()=>setConnected(true));when_disconnect_func_list.push(()=>setConnected(false));
    message_proc_func_list.push(data=>{
        if(data.command==='TASK_RESULT'){const p=pending.get(data.request_id);if(!p)return;pending.delete(data.request_id);clearTimeout(p.timer);if(data.ok)p.resolve(data.data);else p.reject(Object.assign(new Error(data.error?.message||'操作失败'),{code:data.error?.code}));return;}
        if(data.command==='TASK_CHANGED' || data.command==='TASK_INPUT_REQUEST' || data.command==='TASK_INPUT_RESOLVED'){if(data.resync)for(const v of views)v.cursor=null;refresh();}
        if(data.command==='TASK_LOGS' || data.command==='TASK_LOGS_CLEARED'){for(const v of views)if(v.queue===data.queue_id){if(data.command==='TASK_LOGS_CLEARED')v.cursor=null;loadLogs(v);}}
    });
})();
    </script>
